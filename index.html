<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14251e"><meta name="description" content="A free 28-day behavioural reset for focus, habits, and self-trust.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><title>REWIRE — 28 Days</title>
<style>
:root{--bg:#f5f6f2;--ink:#18271f;--muted:#6e7b72;--green:#235b42;--green2:#dfece4;--card:#fff;--line:#e3e8e2;--accent:#c7e6d1;--shadow:0 8px 30px rgba(25,45,35,.06}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:780px;margin:auto;padding:18px 16px 96px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}.brand{font-weight:900;letter-spacing:.15em;font-size:1.3rem}.tag{color:var(--muted);font-size:.76rem}.hero{background:linear-gradient(145deg,#163c2b,#245b42);color:white;border-radius:24px;padding:24px;box-shadow:var(--shadow)}.hero small{opacity:.75;letter-spacing:.12em}.hero h1{font-size:1.7rem;margin:10px 0}.hero p{margin:0;color:#d6e7dc;line-height:1.5}.progressrow{display:flex;justify-content:space-between;font-size:.83rem;margin:18px 0 8px;color:#e5f3e9}.bar{height:9px;border-radius:20px;background:#ffffff38;overflow:hidden}.bar span{display:block;height:100%;background:#c8e8d2;width:0;border-radius:20px;transition:.3s}.nav{display:flex;gap:8px;margin:18px 0;overflow:auto}.nav button{white-space:nowrap;padding:10px 14px;border-radius:99px;background:#e8ece7;color:#41564a}.nav button.active{background:var(--green);color:white}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:var(--green2);color:var(--green);font-size:.75rem;font-weight:700}.daytitle{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.exercise{line-height:1.6}.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}input[type=checkbox]{accent-color:var(--green);width:20px;height:20px;flex:0 0 auto;margin-top:2px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfa;color:var(--ink);margin:6px 0}.btn{background:var(--green);color:white;border-radius:12px;padding:12px 16px;font-weight:700}.btn.secondary{background:#e8eee9;color:var(--green)}.btn.danger{background:#fff0ee;color:#994c41}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.timer{font-size:3rem;font-weight:800;text-align:center;margin:16px}.small{font-size:.86rem}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.daybtn{aspect-ratio:1;border-radius:11px;background:#e9ede8;color:#55645a;font-weight:700}.daybtn.done{background:#cfe7d6;color:#22583e}.daybtn.today{outline:2px solid #235b42;outline-offset:1px}.daybtn.lock{opacity:.45}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f1f5f1;border-radius:14px;padding:12px;text-align:center}.stat strong{font-size:1.3rem;display:block}.stat span{font-size:.72rem;color:var(--muted)}.quote{background:#eef5ef;border-left:4px solid #75a787;padding:14px;border-radius:10px;color:#355c44}.hidden{display:none!important}.footer{position:fixed;bottom:0;left:0;right:0;background:#f5f6f2ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px max(16px,calc((100vw - 780px)/2));display:flex;gap:8px}.footer button{flex:1}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#193a2a;color:white;padding:12px 16px;border-radius:12px;display:none;z-index:9}.weeklabel{color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.08em;margin:18px 0 6px}.details{font-size:.93rem;line-height:1.65}.details li{margin-bottom:6px}@media(min-width:600px){.wrap{padding-top:28px}.hero h1{font-size:2.2rem}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="brand">REWIRE</div><div class="tag">28 DAYS · FOCUS · HABITS · SELF-TRUST</div></div><button class="btn secondary" id="installBtn" style="display:none">Install</button></header>
<section class="hero"><small>YOUR PERSONAL RESET</small><h1>Small actions.<br>Stronger patterns.</h1><p>Build the ability to begin, follow through, and restart without punishing yourself.</p><div class="progressrow"><span id="progressLabel">0 of 28 days completed</span><span id="progressPct">0%</span></div><div class="bar"><span id="progressBar"></span></div></section>
<div class="nav"><button class="active" data-tab="today">Today</button><button data-tab="journey">28-day journey</button><button data-tab="tools">Tools</button><button data-tab="journal">Journal</button><button data-tab="settings">Settings</button></div>
<section id="todayTab"></section><section id="journeyTab" class="hidden"></section><section id="toolsTab" class="hidden"></section><section id="journalTab" class="hidden"></section><section id="settingsTab" class="hidden"></section>
</div><div class="footer"><button class="btn secondary" id="prevDay">← Previous</button><button class="btn" id="markDay">Complete today's practice ✓</button><button class="btn secondary" id="nextDay">Next →</button></div><div class="toast" id="toast"></div>
<script>
const days=[
['Catch the avoidance','Notice what happens immediately before you avoid a task.','Identify one task you are avoiding. Name the feeling (boredom, fear, overwhelm, confusion, fatigue). Write the excuse your mind gives. Then do just 5 minutes.',['Name one avoided task','Name the emotion beneath it','Write the automatic excuse','Try a 5-minute start'],'Awareness'],['Spot your escape routes','Catch the behaviours that pull you away.','For one day, notice when you switch to scrolling, snacking, busywork, or another escape. No judgment; record the moment.',['Notice one avoidance loop','Record what you switched to','Notice the trigger'],'Awareness'],['Name the feeling','Emotions often drive avoidance more than the task itself.','When you resist, pause and label the feeling as precisely as you can. Ask: what would make the next step 10% easier?',['Pause once when resisting','Name the feeling','Make the next step smaller'],'Awareness'],['Excuse audit','Separate facts from familiar stories.','Write your 3 most common procrastination thoughts. For each, create a neutral response that helps you act.',['Write 3 recurring thoughts','Create a kinder factual response'],'Awareness'],['Five-minute start','Starting is the practice—not finishing.','Choose one postponed task. Set a timer for 5 minutes and begin. Stop when it rings if you wish.',['Choose task','Start timer for 5 minutes','Begin before you feel ready'],'Awareness'],['Change your environment','Make the helpful behaviour easier to reach.','Remove one distraction and prepare what you need for tomorrow’s first task.',['Remove one distraction','Prepare materials'],'Awareness'],['Weekly reflection','Review without shame.','What did you notice? What helped you start? What was hard? Choose one adjustment for next week.',['Reflect on the week','Choose one adjustment'],'Awareness'],
['If–Then plan','Turn intention into a cue and response.','Write one plan: If [specific cue], then I will [tiny action]. Example: after coffee, I open the document and write one sentence.',['Write one If–Then plan','Make the action tiny and specific','Try it once'],'Initiation'],['Start a postponed task','Practise approaching, not avoiding.','Work on one postponed task for 5 minutes. Focus on the next visible action only.',['Choose task','Define the next visible action','Work for 5 minutes'],'Initiation'],['Five small steps','Overwhelm shrinks when tasks become concrete.','Break one big task into 5 steps. Circle the easiest step and start there.',['Write 5 steps','Pick the easiest','Begin'],'Initiation'],['Messy first draft','Practise imperfection.','Make a deliberately imperfect first attempt—draft, recording, budget, plan, or workout. Do not polish.',['Choose a task','Make a rough first attempt'],'Initiation'],['Phone boundary','Protect a small focus window.','Put your phone out of reach for 15 minutes while doing one task.',['Choose task','Put phone away','Focus 15 minutes'],'Initiation'],['Earned scroll','Put creation before consumption.','Complete one small meaningful task before social media or entertainment. Keep the task modest.',['Define small task','Complete before entertainment'],'Initiation'],['Review and reward','Reinforce effort.','Review week 2. Celebrate starting, not just finishing. Choose a small healthy reward.',['Review attempts','Choose a reward'],'Initiation'],
['Pause and allow','You can act while uncomfortable.','Pause. Notice sensations. Name the emotion. Take 5 slow breaths, then start a tiny action without waiting for the feeling to vanish.',['Pause','Name emotion and body sensation','Take 5 breaths','Start a small action'],'Resilience'],['Discomfort ladder','Approach in manageable steps.','Write 5 steps from easiest to hardest for something you avoid. Try step 1 or 2 today.',['Write 5 gradual steps','Try one manageable step'],'Resilience'],['Challenge a belief','Replace harsh labels with evidence.','Write a self-critical thought. List facts for and against it. Write a balanced response—not forced positivity.',['Write the thought','Review evidence','Write a balanced alternative'],'Resilience'],['Stay for 2 more minutes','Practise gently extending effort.','When you want to quit a manageable task, stay for just 2 additional minutes—unless you need genuine rest.',['Notice urge to quit','Try 2 extra minutes if appropriate'],'Resilience'],['Say no or renegotiate','Protect your capacity.','Decline, delay, or renegotiate one nonessential request. Use a clear, respectful sentence.',['Identify one unnecessary demand','Practise a boundary sentence'],'Resilience'],['Finish imperfectly','Close a loop.','Complete a small task without polishing it beyond what is necessary.',['Choose small unfinished task','Finish it imperfectly'],'Resilience'],['Review your energy','Notice what drains or restores you.','List 3 drains and 3 restorers. Choose one drain to reduce or one restoration to schedule.',['List drains','List restorers','Make one change'],'Resilience'],
['One promise','Build trust with a promise small enough to keep.','Choose one 2–10 minute daily promise and complete it today.',['Choose a small promise','Complete it'],'Self-trust'],['Restart practice','A missed day is data, not a verdict.','Imagine or review a missed day. Practise the restart: no insult, identify obstacle, shrink task, resume at next opportunity.',['Identify obstacle without blame','Shrink the task','Restart'],'Self-trust'],['Act before ready','Readiness can follow action.','Choose one meaningful task. Begin with a 2-minute action before checking for motivation.',['Choose task','Do 2-minute action'],'Self-trust'],['Evidence of progress','Track what you did.','Write 3 examples of showing up, adapting, or asking for help.',['Write 3 evidence points'],'Self-trust'],['Make a personal rule','Create a rule that helps you recover.','Write 3 personal anti-procrastination rules. Keep them realistic and supportive.',['Write 3 rules','Choose one to practise'],'Self-trust'],['Design next month','Keep what works.','Review your strongest tools. Choose 1 habit to continue and a minimum version for hard days.',['Review tools','Choose habit','Define minimum version'],'Self-trust'],['Celebrate and recommit','Progress is returning, not perfection.','Review the month. Celebrate effort and honesty. Set one next 30-day intention.',['Review your month','Celebrate something real','Set next intention'],'Self-trust'],['Your reset day','You have practised awareness, starting, resilience, and self-trust.','Write what changed, what still needs support, and your next small step. This programme is a starting point, not a test.',['Write what changed','Name what needs support','Choose next small step'],'Integration']
];
const quotes=['I do not need to change everything today. I only need to practise a new response.','Small starts count.','Notice without judging.','Make the next step smaller.','You can restart at the next opportunity.'];
let state=JSON.parse(localStorage.getItem('rewireState')||'{}');state.completed=state.completed||[];state.notes=state.notes||{};state.checks=state.checks||{};state.journals=state.journals||{};state.moods=state.moods||{};state.startDate=state.startDate||new Date().toISOString().slice(0,10);state.selectedDay=state.selectedDay||1;let current=state.selectedDay;let deferredInstall=null;
function save(){localStorage.setItem('rewireState',JSON.stringify(state));renderAll()};function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function dayNum(){return current}function done(d){return state.completed.includes(d)}function toggleCheck(i){state.checks[current]=state.checks[current]||[];state.checks[current][i]=!state.checks[current][i];save()}
function renderToday(){let d=days[current-1],checks=state.checks[current]||[],n=done(current);document.getElementById('todayTab').innerHTML=`<div class="card"><div class="daytitle"><div><span class="pill">WEEK ${Math.ceil(current/7)} · ${d[4]}</span><h2>Day ${current}: ${d[0]}</h2><div class="muted small">${d[1]}</div></div><div class="pill">${n?'Completed ✓':'In progress'}</div></div><div class="exercise details"><p>${d[2]}</p><div class="checks">${d[3].map((x,i)=>`<label><input type="checkbox" ${checks[i]?'checked':''} onchange="toggleCheck(${i})"><span>${x}</span></label>`).join('')}</div></div><div class="quote">${quotes[current%quotes.length]}</div><h3 style="margin-top:18px">Quick check-in</h3><div class="row"><div><label class="small muted">Mood (1–5)</label><select class="field" onchange="saveMood('mood',this.value)"><option value="">Choose</option>${[1,2,3,4,5].map(v=>`<option ${state.moods[current]?.mood==v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="small muted">Energy (1–5)</label><select class="field" onchange="saveMood('energy',this.value)"><option value="">Choose</option>${[1,2,3,4,5].map(v=>`<option ${state.moods[current]?.energy==v?'selected':''}>${v}</option>`).join('')}</select></div><div><label class="small muted">Focus (1–5)</label><select class="field" onchange="saveMood('focus',this.value)"><option value="">Choose</option>${[1,2,3,4,5].map(v=>`<option ${state.moods[current]?.focus==v?'selected':''}>${v}</option>`).join('')}</select></div></div><label class="small muted">What did I notice today?</label><textarea class="field" rows="3" placeholder="Write a few lines..." oninput="saveNote(this.value)">${state.notes[current]||''}</textarea><button class="btn" onclick="markDone()">${n?'Completed — undo':'Complete day'}</button></div>`}
function renderJourney(){let completed=state.completed.length;document.getElementById('journeyTab').innerHTML=`<div class="card"><h2>Your 28-day journey</h2><div class="stats"><div class="stat"><strong>${completed}</strong><span>Completed</span></div><div class="stat"><strong>${Math.max(0,28-completed)}</strong><span>Remaining</span></div><div class="stat"><strong>${Math.round(completed/28*100)}%</strong><span>Progress</span></div></div><p class="muted small">Tap any day to review or practise it. Missed days are never locked.</p>${[0,1,2,3].map(w=>`<div class="weeklabel">WEEK ${w+1} · ${['AWARENESS','INITIATION','RESILIENCE','SELF-TRUST'][w]}</div><div class="card"><div class="daygrid">${Array.from({length:7},(_,i)=>w*7+i+1).map(d=>`<button class="daybtn ${done(d)?'done':''} ${current===d?'today':''}" onclick="selectDay(${d})">${d}${done(d)?'✓':''}</button>`).join('')}</div></div>`).join('')}</div>`}
function renderTools(){document.getElementById('toolsTab').innerHTML=`<div class="card"><h2>Focus timer</h2><p class="muted">Pick a short window. Starting is the win.</p><div class="row"><button class="btn secondary" onclick="setTimer(5)">5 minutes</button><button class="btn secondary" onclick="setTimer(10)">10 minutes</button><button class="btn secondary" onclick="setTimer(15)">15 minutes</button></div><div class="timer" id="timerDisplay">05:00</div><div class="row"><button class="btn" id="timerStart" onclick="startTimer()">Start</button><button class="btn secondary" onclick="pauseTimer()">Pause</button><button class="btn secondary" onclick="resetTimer()">Reset</button></div><p class="muted small" id="timerMessage">Put your phone aside and focus on one task.</p></div><div class="card"><h2>Break it down</h2><p class="muted">Turn a task into small, concrete actions.</p><input class="field" id="bigTask" placeholder="The task I feel overwhelmed by"><button class="btn secondary" onclick="breakTask()">Create tiny steps</button><div id="stepsOutput"></div></div><div class="card"><h2>Reframe a thought</h2><label class="small muted">What is the thought?</label><textarea id="thought" class="field" rows="2" placeholder="I'm never consistent..."></textarea><label class="small muted">What facts support or challenge it?</label><textarea id="evidence" class="field" rows="2" placeholder="Evidence, not judgment..."></textarea><button class="btn secondary" onclick="reframe()">Build a balanced thought</button><div id="reframeOutput"></div></div><div class="card"><h2>Restart protocol</h2><ol class="details"><li>No self-insults.</li><li>Identify what interrupted you.</li><li>Reduce the task.</li><li>Resume at the next opportunity.</li></ol><button class="btn secondary" onclick="toast('You can restart right now. Choose one tiny action.')">I am restarting</button></div>`}
function renderJournal(){let all=Object.keys(state.journals).sort((a,b)=>b.localeCompare(a));document.getElementById('journalTab').innerHTML=`<div class="card"><h2>Journal</h2><p class="muted">Save a reflection for today. You can also review past entries.</p><label class="small muted">Date</label><input class="field" type="date" id="journalDate" value="${new Date().toISOString().slice(0,10)}"><textarea class="field" rows="5" id="journalText" placeholder="What happened? What did I feel? What did I do anyway? What do I want to remember?">${state.journals[new Date().toISOString().slice(0,10)]||''}</textarea><button class="btn" onclick="saveJournal()">Save journal entry</button></div><div class="card"><h3>Past entries</h3>${all.length?all.map(date=>`<details><summary>${date}</summary><p>${escapeHtml(state.journals[date]).replace(/\n/g,'<br>')}</p></details>`).join(''):'<p class="muted">Your saved entries will appear here.</p>'}</div>`}
function renderSettings(){document.getElementById('settingsTab').innerHTML=`<div class="card"><h2>Reminder</h2><p class="muted">Choose a daily time. Notifications work when the app is installed/hosted and permission is granted. Browser support varies.</p><input class="field" type="time" id="reminderTime" value="${state.reminderTime||'09:00'}"><button class="btn" onclick="setReminder()">Enable reminder</button><button class="btn secondary" onclick="disableReminder()">Disable reminder</button><p class="small muted" id="reminderStatus">${state.reminderTime?'Reminder set for '+state.reminderTime:'No reminder enabled'}</p></div><div class="card"><h2>Backup / reset</h2><button class="btn secondary" onclick="exportData()">Export my progress</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Import backup</button><input type="file" id="importFile" accept="application/json" hidden onchange="importData(event)"><button class="btn danger" onclick="resetData()">Reset all progress</button><p class="muted small">Your progress is stored on this device/browser. Export backups occasionally.</p></div><div class="card"><h2>About</h2><p class="details">REWIRE is a self-guided behavioural practice tool, not a medical or mental-health diagnosis or treatment. Keep exercises gentle. If fatigue or low mood is persistent or impairing, consider professional support.</p></div>`}
function renderAll(){let doneN=state.completed.length,pct=Math.round(doneN/28*100);document.getElementById('progressLabel').textContent=`${doneN} of 28 days completed`;document.getElementById('progressPct').textContent=pct+'%';document.getElementById('progressBar').style.width=pct+'%';renderToday();renderJourney();renderTools();renderJournal();renderSettings()}
function selectDay(d){current=d;state.selectedDay=d;save();switchTab('today');window.scrollTo({top:0,behavior:'smooth'})}function markDone(){if(done(current)){state.completed=state.completed.filter(x=>x!==current);toast('Day reopened. No pressure.')}else{state.completed.push(current);state.completed.sort((a,b)=>a-b);toast('Day completed. Nice work showing up.')}save()}function saveNote(v){state.notes[current]=v;localStorage.setItem('rewireState',JSON.stringify(state))}function saveMood(k,v){state.moods[current]=state.moods[current]||{};state.moods[current][k]=v;localStorage.setItem('rewireState',JSON.stringify(state))}
function switchTab(t){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));['today','journey','tools','journal','settings'].forEach(x=>document.getElementById(x+'Tab').classList.toggle('hidden',x!==t));document.querySelector('.footer').style.display=t==='today'?'flex':'none'}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.getElementById('prevDay').onclick=()=>selectDay(Math.max(1,current-1));document.getElementById('nextDay').onclick=()=>selectDay(Math.min(28,current+1));document.getElementById('markDay').onclick=markDone;
function setTimer(m){pauseTimer();timerSecs=m*60;document.getElementById('timerDisplay').textContent=format(timerSecs);document.getElementById('timerMessage').textContent=`Ready for ${m} focused minutes.`}let timerSecs=300,timerId=null;function format(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function startTimer(){if(timerId)return;timerId=setInterval(()=>{timerSecs--;document.getElementById('timerDisplay').textContent=format(timerSecs);if(timerSecs<=0){pauseTimer();document.getElementById('timerMessage').textContent='Time! You showed up for yourself.';toast('Focus session complete!');}},1000)}function pauseTimer(){if(timerId){clearInterval(timerId);timerId=null}}function resetTimer(){pauseTimer();timerSecs=300;document.getElementById('timerDisplay').textContent='05:00'}function breakTask(){let t=document.getElementById('bigTask').value.trim();if(!t){toast('Enter a task first');return}document.getElementById('stepsOutput').innerHTML=`<div class="quote"><strong>Task:</strong> ${escapeHtml(t)}<br><br>1. Gather what you need<br>2. Open or prepare the workspace<br>3. Do the smallest visible action<br>4. Continue for 5 minutes<br>5. Review and choose next step</div>`}function reframe(){let t=document.getElementById('thought').value.trim(),e=document.getElementById('evidence').value.trim();if(!t){toast('Write the thought first');return}document.getElementById('reframeOutput').innerHTML=`<div class="quote"><strong>Original thought:</strong> ${escapeHtml(t)}<br><strong>Evidence:</strong> ${escapeHtml(e||'What facts do I actually know?')}<br><strong>Balanced response:</strong> This is a difficult moment, not a permanent identity. I can take one small step and reassess.</div>`}function saveJournal(){let date=document.getElementById('journalDate').value;if(!date)return;state.journals[date]=document.getElementById('journalText').value;save();toast('Journal saved')}function setReminder(){let t=document.getElementById('reminderTime').value;if(!t){toast('Choose a time');return}if(!('Notification'in window)){toast('Notifications not supported in this browser');return}Notification.requestPermission().then(p=>{if(p==='granted'){state.reminderTime=t;save();toast('Reminder time saved. Keep the app/browser notification permission enabled.')}else toast('Notification permission not granted')})}function disableReminder(){state.reminderTime='';save();toast('Reminder setting cleared')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rewire-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.completed)throw 0;state=d;save();toast('Backup imported')}catch{toast('Invalid backup file')}};r.readAsText(f)}function resetData(){if(confirm('Reset all REWIRE progress and journal data? This cannot be undone.')){localStorage.removeItem('rewireState');state={completed:[],notes:{},checks:{},journals:{},moods:{},selectedDay:1,startDate:new Date().toISOString().slice(0,10)};current=1;save();toast('Progress reset')}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem('rewireState',JSON.stringify(state));renderAll()}
// PWA install prompt
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('installBtn').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(deferredInstall){deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null}};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
// Reminder check: works while this app is open; browsers may restrict background delivery.
let lastReminderDay='';setInterval(()=>{if(!state.reminderTime||Notification.permission!=='granted')return;let now=new Date(),hh=String(now.getHours()).padStart(2,'0'),mm=String(now.getMinutes()).padStart(2,'0'),today=now.toISOString().slice(0,10);if(`${hh}:${mm}`===state.reminderTime&&lastReminderDay!==today){lastReminderDay=today;new Notification('REWIRE — your daily practice',{body:'Take 10–20 minutes for today’s small step. You can restart without guilt.',icon:'icons/icon.svg'});}},30000);renderAll();switchTab('today');
</script></body></html>
